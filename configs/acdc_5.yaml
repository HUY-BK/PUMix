experiment_name: pumix_acdc_5pct
seed: 42

dataset:
  name: ACDC
  root: ./data/ACDC
  image_size: 256
  num_classes: 4
  labeled_num: 3       # 3 / 70 training patients (~5%), as reported in the paper
  labeled_percent: 5

loader:
  labeled_batch_size: 4
  unlabeled_batch_size: 4
  num_workers: 2

training:
  epochs: 300
  student_learning_rate: 0.001
  weight_decay: 0.00001
  ema_alpha: 0.99
  lr_factor: 0.5
  lr_patience: 20
  consistency_max_weight: 0.2
  rampup_epochs: 20
  contrastive_weight: 0.02
  contrastive_warmup_epochs: 20

aupm:
  patch_size: 16
  low_ratio: 0.20
  high_ratio: 0.30

mspr:
  feature_channels: [64, 128, 256]
  momentum: 0.99
  confidence_threshold: 0.90

spcl:
  projection_dim: 256
  temperature: 0.07
  confidence_threshold: 0.90

evaluation:
  aggregation: global_concat

output:
  dir: ./outputs
